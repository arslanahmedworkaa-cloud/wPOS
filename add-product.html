<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" href="style3.css">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <h1>Add Product</h1>

    <form class="addproduct" id="add-product">
        <center>
            <div class="add-form">
                <label for="productid">Product ID: </label>
                <input type="text" id="productid" required><br><br>

                <label for="productname">Product Name: </label>
                <input type="text" id="productname" required><br><br>

                <label for="price">Price: </label>
                <input type="number" id="price" step="0.01" required><br><br>
            </div>

            <p id="statusMessage"></p>

            <div class="buttons">
                <button type="submit" id="submit" class="save">Save</button>
                <button type="reset" class="reset">Reset</button>
            </div>
        </center>
    </form>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const {
                createClient
            } = window.supabase;

            const SUPABASE_URL = "https://edljwkrilrwphsdaesmr.supabase.co";
            const SUPABASE_ANON_KEY = "sb_publishable_L4Pb9-lL4bvUrjFoye6pXg_CAcFxIHG";
            const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const form = document.getElementById('add-product');
            const statusMessage = document.getElementById('statusMessage');

            form.addEventListener('submit', async(e) => {
                e.preventDefault(); // Prevents URL reloading with '?'
                statusMessage.style.color = "black";
                statusMessage.innerText = "Submitting...";

                const productid = document.getElementById('productid').value;
                const productname = document.getElementById('productname').value;
                const price = parseFloat(document.getElementById('price').value);

                const {
                    data,
                    error
                } = await supabase
                    .from('products')
                    .insert([{
                        productid: productid,
                        productname: productname,
                        price: price
                    }]);

                if (error) {
                    console.error("Error inserting data:", error);
                    statusMessage.style.color = "red";
                    statusMessage.innerText = `Error: ${error.message}`;
                } else {
                    statusMessage.style.color = "green";
                    statusMessage.innerText = "Data successfully inserted!";
                    form.reset();
                }
            });
        });
    </script>
</body>

</html>
